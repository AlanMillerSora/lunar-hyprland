name: CI

# Гоняю гейт на каждый push в ветки и на PR. Релиз (тег v*) — отдельный
# release.yml, его не трогаю.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ci/check.sh
        run: bash ci/check.sh

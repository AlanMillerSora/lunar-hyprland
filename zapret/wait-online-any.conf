# Дроп-ин для systemd-networkd-wait-online.service.
#
# По умолчанию wait-online ждёт, пока ВСЕ управляемые интерфейсы станут
# онлайн. Если wlan0 без носителя (кабель — основной), он висит 2 минуты
# таймаута, и всё, что стоит After=network-online.target (в т.ч. zapret),
# стартует только после. Возвращаемся, как только любой интерфейс онлайн.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=15

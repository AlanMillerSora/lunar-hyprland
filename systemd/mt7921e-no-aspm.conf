# ════════════════════════════════════════════════════════════
#  MediaTek MT7902/MT7921 (mt7921e) — стабильность Wi-Fi.
#
#  Симптомы без этого: пинг даже до своего роутера прыгал до 2 секунд,
#  скорость приёма падала с 540 до 6 Мбит/с, ~2 ретрансмиссии на пакет.
#  Перезагрузка модуля состояние чинит, а отключение PCIe ASPM L1
#  не даёт деградации вернуться. Ноут всегда на зарядке, десктопу
#  энергосбережение PCIe тем более не нужно.
#
#  Ставится install.sh в /etc/modprobe.d/.
# ════════════════════════════════════════════════════════════
options mt7921e disable_aspm=1

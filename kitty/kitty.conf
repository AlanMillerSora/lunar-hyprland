# ════════════════════════════════════════════════════════════
#  kitty — Lunar Eclipse палитра (ночь + лунное свечение)
# ════════════════════════════════════════════════════════════

font_family JetBrains Mono
font_size 11.0
disable_ligatures never
macos_titlebar_color background

# Прозрачный фон — сквозь него видно blur Hyprland
background_opacity 0.94
background_blur 0.5

foreground            #e6e6e6
background            #000000
selection_foreground  #000000
selection_background  #7ea6ff

# Чёрно-синяя тема (dull / bright пары)
color0  #000000
color1  #ff5a5a
color2  #7fce9d
color3  #ffd166
color4  #7ea6ff
color5  #b7a6ff
color6  #6fdce5
color7  #cdcdcd
color8  #6f6f6f
color9  #ff8585
color10 #a3e4b8
color11 #ffe08a
color12 #a6c0ff
color13 #cdc0ff
color14 #8feef5
color15 #ffffff

cursor                #7ea6ff
cursor_text_color     #000000
url_color             #7ea6ff

# Комфортные отступы
window_padding_width 8
cursor_blink_interval 0
scrollback_lines 10000
# ════════════════════════════════════════════════════════════
#  kitty — Lunar Eclipse палитра (ночь + лунное свечение)
# ════════════════════════════════════════════════════════════

font_family JetBrains Mono
font_size 11.5
disable_ligatures never

# Прозрачный фон — сквозь него видно blur Hyprland
background_opacity 0.94
background_blur 10
dynamic_background_opacity yes

foreground            #e6e6e6
background            #000000
selection_foreground  #000000
selection_background  #7ea6ff

# Чёрно-синяя тема (dull / bright пары)
color0  #000000
color1  #ff5a5a
color2  #7fce9d
color3  #ffd166
color4  #7ea6ff
color5  #b7a6ff
color6  #6fdce5
color7  #cdcdcd
color8  #6f6f6f
color9  #ff8585
color10 #a3e4b8
color11 #ffe08a
color12 #a6c0ff
color13 #cdc0ff
color14 #8feef5
color15 #ffffff

cursor                #7ea6ff
cursor_text_color     #000000
cursor_shape          beam
cursor_blink_interval 0.5
cursor_trail          3
cursor_trail_decay    0.1 0.4
url_color             #7ea6ff

# Комфорт
window_padding_width 10
scrollback_lines 10000
enable_audio_bell no
window_alert_on_bell no
confirm_os_window_close 0
copy_on_select clipboard

# Вкладки: полоска появляется только когда вкладок ≥ 2
tab_bar_min_tabs 2
tab_bar_style fade
tab_powerline_style round
active_tab_background   #7ea6ff
active_tab_foreground   #000000
inactive_tab_background #0a0a0a
inactive_tab_foreground #9f9f9f

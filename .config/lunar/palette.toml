# ════════════════════════════════════════════════════════════════
#  Lunar Eclipse · единая палитра
#  Один источник цветов для всего риса. Отсюда цвета раскидывает
#  генератор ~/.config/hypr/scripts/eclipse-palette.py по приложениям
#  (kitty, GTK3/4, qt6ct, mako, btop, yazi) и пишет кэш для QML:
#  ~/.cache/lunar/palette.json — его читает Theme.qml.
#
#  Как пользоваться:
#    eclipse-palette.py                 — dry-run, показывает план
#    eclipse-palette.py --apply         — разложить активный пресет
#    eclipse-palette.py --preset steel --apply
#
#  active — имя пресета, который сейчас рулит. Меняешь одну строку —
#  и весь рис перекрашивается после --apply (плюс перезапуск приложений).
# ════════════════════════════════════════════════════════════════

active = "lunar"


# ── lunar: текущая холодная палитра риса ────────────────────────
#  Угольный монохром без цветного акцента, но не «чёрное на белом»:
#  полная серая лестница — поверхности bg→panel→card→track→hover
#  приподняты мягкими ступенями, текст fg→soft→dim→muted→faint.
#  Вторичный тон textDim — приглушённый сине-серый (#8b93a7, как
#  fg_muted у 43PR): именно он даёт «мягкость», поэтому не весь
#  текст белый. Акцент — серебристый, а не чистый белый.
[presets.lunar]
bg           = "#0a0b0f"   # fg-фон: не уголь #000, чуть приподнят
bgPanel      = "#0f1116"   # панель/стекло — первая ступень
bgCard       = "#151920"   # карточки — вторая ступень
bgTrack      = "#1d2129"   # дорожки/выделение — третья ступень
bgHover      = "#262b36"   # наведение поверхности (аналог 43pr #242832)
text         = "#e6eaf2"   # fg: мягкий белый вместо почти-белого
textSoft     = "#c3c9d3"   # fg_soft: светлая серая (акцент «ок»/медиа)
textDim      = "#8b93a7"   # fg_muted: сине-серый вторичный — «мягкость»
textMuted    = "#6f7787"   # приглушённый сине-серый
textFaint    = "#565d6b"   # fg_faint: подписи/служебное
accent       = "#c9d2e2"   # мягкий серебристый — доля чистого белого ниже
accent2      = "#e6eaf2"
danger       = "#ff003c"
ok           = "#c3c9d3"
border       = "#ffffff12"
borderAccent = "#ffffff20"
barText      = "#d3d9e3"
barDim       = "#9aa3b2"
barFaint     = "#6f7787"
barPill      = "#0f1116"
cursor       = "#e6eaf2"


# ── steel: холодный серо-синий с одним тихим акцентом ───────────
#  Тот же характер, что lunar, но с настоящим цветом: синий акцент
#  (#7aa2f7) на сине-серых поверхностях. Лестница та же — чтобы
#  монохром и цветной пресеты читались одинаково мягко.
[presets.steel]
bg           = "#090c12"
bgPanel      = "#0e131c"
bgCard       = "#141b27"
bgTrack      = "#1b2432"
bgHover      = "#243044"
text         = "#e0e7f2"
textSoft     = "#c0cada"
textDim      = "#8c9ab0"
textMuted    = "#6f7d93"
textFaint    = "#525d70"
accent       = "#8fb0ea"
accent2      = "#b7ccff"
danger       = "#ff4d6a"
ok           = "#c0cada"
border       = "#ffffff12"
borderAccent = "#7aa2f733"
barText      = "#cdd8e8"
barDim       = "#9aa8bd"
barFaint     = "#6f7d93"
barPill      = "#0e131c"
cursor       = "#e0e7f2"


# ── mono: палитра 43PR (чёрный фон, белый акцент) ───────────────
#  Оригинальные цвета 43PR/dotfiles (themes/default.toml): чёрный фон,
#  белая шкала текста, белый акцент, сине-серый hover, зелёный ok.
[presets.mono]
bg           = "#000000"
bgPanel      = "#050505"
bgCard       = "#0d0d0d"
bgTrack      = "#161616"
bgHover      = "#242832"
text         = "#ffffff"
textSoft     = "#e6eaf2"
textDim      = "#c2c2c2"
textMuted    = "#8b93a7"
textFaint    = "#4a4a4a"
accent       = "#ffffff"
accent2      = "#ffffff"
danger       = "#ff003c"
ok           = "#00ff9c"
border       = "#151515"
borderAccent = "#2a2a2a"
barText      = "#ffffff"
barDim       = "#c2c2c2"
barFaint     = "#8b93a7"
barPill      = "#050505"
cursor       = "#cccccc"

# Lunar Player — cava для «сейчас играет» в сайдбаре.
# Вывод: raw ASCII в stdout, по строке на кадр; значения 0..1000 через пробел.
# Читает lunar_qt.py (поток) и рисует столбики.
[general]
framerate = 30
bars = 24
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 32
frame_delimiter = 10

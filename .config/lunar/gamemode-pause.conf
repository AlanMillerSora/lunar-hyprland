# ════════════════════════════════════════════════════════════════
#  Lunar Eclipse — Game Mode: что выгружать на время игры.
#
#  По одной systemd-единице на строку. Останавливаются только те,
#  что были активны; при выключении Game Mode они поднимаются обратно.
#
#  Формат:
#    ollama.service            # user-юнит (по умолчанию)
#    user:ollama.service       # то же, явно
#    system:zapret.service     # системный (через root-хелпер svc.sh)
#
#  Системные юниты останавливаются хелпером /usr/libexec/lunar/svc.sh,
#  у него свой allowlist: zapret.service, sddm.service, bluetooth.service.
#  Юнит вне списка молча пропускается.
#
#  Строки с # игнорируются. Пусто = ничего не выгружается.
# ════════════════════════════════════════════════════════════════

# Примеры (раскомментируй нужное):
# ollama.service            # локальная модель чата
# system:zapret.service     # обход DPI (в игре не нужен)

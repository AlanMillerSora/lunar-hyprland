# Lunar Eclipse — конфиг cava для полосы «сейчас играет» в верхнем баре.
# Вывод: raw ASCII в stdout, по строке на кадр; значения 0..1000 через пробел.
# Читает Quickshell (Process + SplitParser), рисует столбики шириной 1/3 поля.
[general]
framerate = 30
bars = 20
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 32
frame_delimiter = 10

# Lunar Eclipse — конфиг cava для спектра в окне плеера.
# Отдельный от бара (20 полос) и сайдбара (56): здесь 64 — самая широкая
# картина, окно плеера большое. Монохром: вывод — сырой ASCII, цвет
# (белый на #050505) задаёт Quickshell, сам cava палитру не красит.
# Вывод: raw ASCII в stdout, по строке на кадр; значения 0..1000 через пробел.
[general]
framerate = 60
bars = 64
autosens = 1
sensitivity = 110
lower_cutoff_freq = 40
higher_cutoff_freq = 14000

# сглаживание на стороне cava: убирает «дёрганость» спектра
[smoothing]
monstercat = 1
waves = 0
noise_reduction = 0.55

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 32
frame_delimiter = 10

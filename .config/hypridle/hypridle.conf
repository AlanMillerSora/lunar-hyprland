# ════════════════════════════════════════════════════════════
#  hypridle — таймауты: 10 мин блокировка, 15 мин гашение DPMS
# ════════════════════════════════════════════════════════════

general {
    # Блокировка удалена из системы по требованию пользователя.
    # Осталось только гашение экрана (DPMS) — это не блокировка.
}

# ВАЖНО: с hypridle 0.1.8 опции listener пишутся через дефис:
#   on-timeout / on-resume (не on_timeout / on_resume!)
# Конфиг должен лежать в ~/.config/hypr/hypridle.conf (см. install.sh).

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
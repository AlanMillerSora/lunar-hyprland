# ════════════════════════════════════════════════════════════════
#  yazi — тема Lunar Eclipse (холодный монохром, как вся система)
#  фон #08090d, текст #e8ecf2, dim #98a1ac, рамки #25272d, danger #ff003c
#  Переопределяем только цвета поверх дефолтов yazi.
# ════════════════════════════════════════════════════════════════

[mgr]
cwd = { fg = "#e8ecf2", bold = true }
find_keyword = { fg = "#e8edf4", bold = true, underline = true }
find_position = { fg = "#98a1ac" }
symlink_target = { fg = "#98a1ac", italic = true }

marker_copied   = { fg = "#98a1ac", bg = "#98a1ac" }
marker_cut      = { fg = "#e8edf4", bg = "#e8edf4" }
marker_marked   = { fg = "#e8edf4", bg = "#e8edf4" }
marker_selected = { fg = "#e8edf4", bg = "#e8edf4" }
marker_symbol   = "│"

count_copied   = { fg = "#08090d", bg = "#98a1ac" }
count_cut      = { fg = "#08090d", bg = "#e8edf4" }
count_selected = { fg = "#08090d", bg = "#e8edf4" }

border_symbol = "│"
border_style  = { fg = "#25272d" }

[tabs]
active   = { fg = "#08090d", bg = "#e8edf4", bold = true }
inactive = { fg = "#98a1ac", bg = "#181b21" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#08090d", bg = "#e8edf4", bold = true }
normal_alt  = { fg = "#e8ecf2", bg = "#181b21" }
select_main = { fg = "#08090d", bg = "#e8edf4", bold = true }
select_alt  = { fg = "#e8ecf2", bg = "#181b21" }
unset_main  = { fg = "#08090d", bg = "#98a1ac", bold = true }
unset_alt   = { fg = "#98a1ac", bg = "#181b21" }

[indicator]
parent  = { fg = "#98a1ac" }
current = { fg = "#e8ecf2", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
perm_sep   = { fg = "#5b636d" }
perm_type  = { fg = "#e8ecf2" }
perm_read  = { fg = "#98a1ac" }
perm_write = { fg = "#98a1ac" }
perm_exec  = { fg = "#98a1ac" }
progress_label  = { fg = "#e8ecf2", bold = true }
progress_normal = { fg = "#e8ecf2", bg = "#08090d" }
progress_error  = { fg = "#08090d", bg = "#ff003c" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

[which]
border          = { fg = "#25272d" }
cols            = 3
cand            = { fg = "#e8ecf2" }
rest            = { fg = "#98a1ac" }
desc            = { fg = "#98a1ac" }
separator       = "  "
separator_style = { fg = "#5b636d" }

[confirm]
border     = { fg = "#25272d" }
title      = { fg = "#e8ecf2" }
btn_yes    = { reversed = true }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[notify]
title_info  = { fg = "#e8ecf2" }
title_warn  = { fg = "#98a1ac" }
title_error = { fg = "#ff003c" }
icon_info   = ""
icon_warn   = ""
icon_error  = ""

[pick]
border   = { fg = "#25272d" }
active   = { fg = "#e8ecf2", bold = true }
inactive = {}

[input]
border   = { fg = "#25272d" }
selected = { reversed = true }

[cmp]
border   = { fg = "#25272d" }
active   = { reversed = true }
inactive = {}
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#25272d" }
hovered = { fg = "#e8edf4", bold = true }

[help]
border  = { fg = "#25272d" }
chord   = { fg = "#e8ecf2" }
hovered = { reversed = true, bold = true }

[fd]
title    = "поиск по имени (fd):"
position = { at = "top-center", y = 2, w = 80, h = 3 }

[rg]
title    = "поиск по содержимому (rg):"
position = { at = "top-center", y = 2, w = 80, h = 3 }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#98a1ac" },
	{ mime = "**/{audio,video}/*", fg = "#98a1ac" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#98a1ac" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#98a1ac" },
	{ mime = "vfs/{absent,stale}", fg = "#5b636d" },
	{ url = "*", is = "orphan", bg = "#ff003c" },
	{ url = "*", is = "exec", fg = "#e8edf4" },
	{ url = "*", is = "dummy", bg = "#ff003c" },
	{ url = "*/", is = "dummy", bg = "#ff003c" },
	{ url = "*/", fg = "#e8edf4" },
]

# Иконки — чистый текст, без цветных глифов (только стрелки папок)
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = [
	{ if = "dir & hovered", text = "▸", fg = "#e8edf4" },
	{ if = "dir",           text = "▸", fg = "#98a1ac" },
	{ if = "!dir",          text = "",  fg = "#98a1ac" },
]
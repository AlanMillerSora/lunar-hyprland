# ═══ kitty · Lunar Eclipse — под дизайн всей системы ═══
# Тёмная полупрозрачная поверхность как у оверлеев (opacity 0.82),
# холодная монохромная палитра, JetBrainsMono Nerd Font (как в панели/Hub).

# ── шелл ──
shell /usr/bin/zsh
# включаю интеграцию с шеллом: kitty видит cwd и команды — новые вкладки
# открываются там, где я стою; приём аккуратно подсмотрен у 43PR
shell_integration enabled

# ── шрифт ──
font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 16

# ── отступы ──
window_margin_width 0
# добавил воздуха: 10 было тесновато для зерна у краёв
window_padding_width 12

# ── окно: не тащить размер и разворот из прошлого запуска ──
# По умолчанию kitty помнит состояние окна (main.json) и, если прошлый
# терминал был развёрнут, каждый новый стартует maximized — в тайлинге
# это накрывает весь стол. Гасим память: пусть размер задаёт Hyprland.
remember_window_size no
# закрываю окно сразу, без забывчивого подтверждения — беру приём у 43PR
confirm_os_window_close 0

# ── курсор: луч вместо блока, мягко мигает (0.5) — приём от 43PR ──
cursor_shape beam
cursor_blink_interval 0.5
cursor #e8ecf2

# ── тема: холодный монохром системы + danger/ok ──
foreground            #e8ecf2
background            #0c0e13
background_opacity    0.78
dynamic_background_opacity no
selection_background  #1c2027
selection_foreground  #e8ecf2
url_color             #e8ecf2

color0  #0c0e13
color1  #98a1ac
color2  #b9c2cc
color3  #e8edf4
color4  #c9d2db
color5  #98a1ac
color6  #b9c2cc
color7  #e8ecf2
color8  #5b636d
color9  #ff003c
color10 #00ff9c
color11 #e8ecf2
color12 #c9d2db
color13 #b9c2cc
color14 #e8ecf2
color15 #ffffff

# ────────────────────────────────────────────────────────────────
#  ЗЕРНО В ТЕРМИНАЛЕ (важно для того, кто будет править)
#
#  Что: поверх фона тайлом лежит PNG с шумом — мелкое «плёночное» зерно
#  в тон стеклу остального риса. Ассет: ~/.config/kitty/noise.png (220×220).
#
#  Как это работает в kitty:
#   • альфа САМОГО ИЗОБРАЖЕНИЯ уважается (фон/обои продолжают просвечивать);
#   • `background_opacity` к картинке НЕ применяется — фейдится только
#     цвет фона, поэтому прозрачность зерна задаётся альфой тайла, а не
#     background_opacity;
#   • `background_image_layout tiled` кладёт тайл в натуральную величину,
#     `background_image_linear yes` сглаживает края тайла.
#
#  Грабли (наступал):
#   • 16-битный grayscale PNG kitty МОЛЧА игнорирует — тайл обязан быть
#     8-битным (у нас RGBA, `srgba`);
#   • светло-серый шум с альфой на тёмном фоне выглядит как белый ТВ-снег —
#     поэтому RGB тёмный и холодный (#0c0e13), а шум даёт только альфа;
#   • непрозрачный тайл (PNG24) съедает прозрачность — терминал перестаёт
#     быть стеклянным; нужен именно PNG32 с альфой.
#
#  Пересобрать тайл (прозрачное зерно):
#    magick -seed 7 -size 220x220 xc:'#0c0e13' -attenuate 0.15 +noise Gaussian \
#        -depth 8 /tmp/rgb.png
#    magick -seed 11 -size 220x220 xc:'#3a3a3a' -attenuate 0.5 +noise Gaussian \
#        -colorspace Gray -normalize -evaluate multiply 0.5 -depth 8 /tmp/a.png
#    magick /tmp/rgb.png /tmp/a.png -alpha off -compose CopyOpacity -composite \
#        PNG32:~/.config/kitty/noise.png
#  Крутилки: сила зерна — средняя альфа (сейчас ~0.23; выше — заметнее),
#  холод фона — цвет RGB тайла и `background` ниже; прозрачность стекла —
#  `background_opacity` (сейчас 0.78).
#  Применить без перезапуска: kill -USR1 $(pgrep -x kitty)
# ────────────────────────────────────────────────────────────────
background_image /home/sora/.config/kitty/noise.png
background_image_layout tiled
background_image_linear yes

# вкладки
tab_bar_style        powerline
tab_bar_min_tabs     1
tab_bar_edge         top
active_tab_foreground   #08090d
active_tab_background   #e8edf4
inactive_tab_foreground #98a1ac
inactive_tab_background #0c0e13
active_tab_font_style   bold
inactive_tab_font_style normal

adjust_line_height 0
hide_window_decorations no
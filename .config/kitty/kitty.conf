# ═══ kitty · Lunar Eclipse — под дизайн всей системы ═══
# Тёмная полупрозрачная поверхность как у оверлеев (Theme.bg ≈ 0.85),
# монохромная палитра, JetBrainsMono Nerd Font (как в панели/Hub).

# ── шрифт ──
font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 16

# ── отступы ──
window_margin_width 0
window_padding_width 10

# ── курсор-блок ──
cursor_shape block
cursor_blink_interval 0
cursor #ffffff

# ── тема: монохром системы + danger/ok ──
foreground            #ffffff
background            #050505
background_opacity    0.85
dynamic_background_opacity no
selection_background  #1e1e1e
selection_foreground  #ffffff
url_color             #ffffff

color0  #050505
color1  #888888
color2  #aaaaaa
color3  #cccccc
color4  #ffffff
color5  #888888
color6  #bbbbbb
color7  #ffffff
color8  #4a4a4a
color9  #ff003c
color10 #00ff9c
color11 #ffffff
color12 #ffffff
color13 #ffffff
color14 #bbbbbb
color15 #ffffff

# вкладки
tab_bar_style        powerline
tab_bar_min_tabs     1
tab_bar_edge         top
active_tab_foreground   #000000
active_tab_background   #ffffff
inactive_tab_foreground #888888
inactive_tab_background #0a0a0a
active_tab_font_style   bold
inactive_tab_font_style normal

adjust_line_height 0
hide_window_decorations no

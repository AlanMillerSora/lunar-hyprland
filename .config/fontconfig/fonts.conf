<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ════════════════════════════════════════════════════════════════
     Lunar Eclipse — настройки шрифтов.
     Цель: чёткие буквы. Wayland не умеет субпиксельное сглаживание,
     поэтому включаю градации серого и лёгкий хинтинг по метрикам шрифта:
     стебли встают ровно на пиксели, текст в мелком кегле не «плывёт».
     ════════════════════════════════════════════════════════════════ -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- у Roboto Mono в мелком кегле чуть плотнее хинтинг, чтобы не выцветала -->
  <match target="font">
    <test name="family"><string>Roboto Mono</string></test>
    <test name="pixelsize" compare="less_eq"><double>14</double></test>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>

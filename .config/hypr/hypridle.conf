# ════════════════════════════════════════════════════════════
#  hypridle — демон простоя. Сейчас простаивает намеренно:
#  экран НЕ гаснет и автоблокировки НЕТ — ни по таймауту, ни иначе.
#  Экран и блокировка — только вручную.
#
#  Путь важен: hypridle ищет конфиг строго в
#  $XDG_CONFIG_HOME/hypr/hypridle.conf (то есть ~/.config/hypr/).
#  Каталог ~/.config/hypridle/ он не читает — конфиг оттуда не работает.
# ════════════════════════════════════════════════════════════

general {
    # lock_cmd не задаём: без него hypridle не заблокирует сессию.
    # Захочешь автолок — верни строку и добавь listener с
    # on-timeout = loginctl lock-session.
    # lock_cmd = pidof hyprlock || hyprlock
}

# Слушателей (listener) нет вовсе — значит, по таймауту не происходит
# ничего: ни гашения экрана, ни блокировки.

# ── Справка: как включить гашение экрана через 15 минут простоя ──
# В Hyprland 0.56 конфиг на Lua, легаси-диспатчеры не работают, поэтому
# правильный вызов такой:
#
#   listener {
#       timeout = 900
#       on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
#       on-resume  = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
#   }
#
# ВНИМАНИЕ: перед включением проверь пробуждение на этой машине —
# по IPC панель может не зажечься, и останешься с чёрным экраном.

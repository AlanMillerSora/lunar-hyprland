# ═══ hyprlock · Lunar HUD ═══

$font = JetBrains Mono
$mono = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    brightness = 0.8
}

# ── часы ──
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = $mono
    font_size = 58
    color = rgba(255, 255, 255, 0.9)

    position = 0, -140
    halign = center
    valign = center
}

# ── дата ──
label {
    monitor =
    text = cmd[update:60000] date +"%A, %e %B" | tr a-z A-Z
    font_family = $font
    font_size = 12
    color = rgba(255, 255, 255, 0.45)

    position = 0, -92
    halign = center
    valign = center
}

# ── сейчас играет ──
label {
    monitor =
    text = cmd[update:1000] sh ~/.config/hypr/scripts/now-playing.sh
    font_family = $font
    font_size = 25
    color = rgba(255, 255, 255, 0.7)

    position = 0, 18
    halign = center
    valign = center
}

# ── hashtag в углу ──
label {
    monitor =
    text = #lunar  19092026
    font_family = $font
    font_size = 11
    color = rgba(255, 255, 255, 0.35)

    position = -30, 30
    halign = right
    valign = top
}

# ── поле пароля ──
input-field {
    monitor =
    size = 420, 62
    outline_thickness = 1
    inner_color = rgba(5, 5, 5, 0.85)
    outer_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(255, 0, 60, 1.0)

    font_family = $font
    font_size = 20
    rounding = 3

    dots_size = 0.12
    dots_spacing = 0.35

    position = 0, -150
    halign = center
    valign = center
}

# ── подсказка раскладки ──
label {
    monitor =
    text = cmd[update:1000] sh ~/.config/hypr/scripts/keymap-hint.sh
    font_family = $font
    font_size = 12
    color = rgba(255, 255, 255, 0.4)

    position = 84, -90
    halign = center
    valign = top
}

# ── подсказка-иконка входа ──
label {
    monitor =
    text = 󰐥
    font_family = $mono
    font_size = 18
    color = rgba(255, 255, 255, 0.6)

    position = 286, -92
    halign = center
    valign = top
}

# ── подпись внизу ──
label {
    monitor =
    text = cmd[update:30000] sh -c "playerctl -l 2>/dev/null | tail -1 | cut -d. -f1"
    font_family = $font
    font_size = 9
    color = rgba(255, 255, 255, 0.15)

    position = 0, -170
    halign = center
    valign = bottom
}

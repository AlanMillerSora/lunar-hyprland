<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Roboto Mono','JetBrainsMono Nerd Font',monospace">
  <rect width="1280" height="800" fill="#0a0b0f"/>

  <style>
    .panel { fill: none; stroke: rgba(255,255,255,0.16); stroke-width:1; }
    .soft  { stroke: rgba(255,255,255,0.10); stroke-width:1; }
    .lbl   { fill:#8b93a7; font-size:11px; letter-spacing:2px; }
    .faint { fill:#565d6b; font-size:10px; }
    .dim   { fill:#8b93a7; font-size:11px; }
    .txt   { fill:#e6eaf2; font-size:11px; }
    .acc   { fill:#c9d2e2; }
    .glyph { fill:#8b93a7; font-size:16px; }
    .glyphAcc { fill:#c9d2e2; font-size:16px; }
    .gap   { fill:#0a0b0f; }
  </style>

  <text x="40" y="30" class="acc" font-size="16" font-weight="bold" letter-spacing="1">LUNAR PLAYER — ЯЗЫК «TEXT» / SPOTIFY-TUI</text>

  <!-- NAV -->
  <rect class="panel" x="40" y="44" width="1200" height="48"/>
  <rect class="gap" x="52" y="36" width="44" height="16"/>
  <text x="56" y="48" class="lbl">NAV</text>
  <text x="64" y="76" class="glyph">‹</text>
  <text x="88" y="76" class="glyph">›</text>
  <text x="112" y="76" class="glyph">⌂</text>
  <text x="150" y="76" class="acc" font-size="14" font-weight="bold">LUNAR PLAYER</text>
  <rect class="soft" x="430" y="56" width="430" height="24"/>
  <text x="442" y="72" class="faint">⌕  что хочешь послушать?</text>
  <text x="1228" y="76" class="dim" text-anchor="end">играет · 03:04</text>

  <!-- LIBRARY -->
  <rect class="panel" x="40" y="112" width="300" height="520"/>
  <rect class="gap" x="52" y="104" width="72" height="16"/>
  <text x="56" y="116" class="lbl">LIBRARY</text>
  <text x="56" y="140" class="dim" font-weight="bold">ТВОЯ ФОНОТЕКА</text>
  <text x="324" y="140" class="acc" text-anchor="end">+</text>
  <line class="soft" x1="56" y1="150" x2="324" y2="150"/>
  <text x="64" y="176" class="acc" font-size="10">♪  ОЧЕРЕДЬ</text>
  <text x="316" y="176" class="faint" text-anchor="end">8</text>
  <text x="64" y="204" class="dim" font-size="10">⌕  РЕЗУЛЬТАТЫ</text>
  <text x="316" y="204" class="faint" text-anchor="end">0</text>
  <text x="64" y="232" class="dim" font-size="10">▤  ЛОКАЛЬНЫЕ</text>
  <text x="316" y="232" class="faint" text-anchor="end">0</text>
  <text x="64" y="260" class="dim" font-size="10">★  ИЗБРАННОЕ</text>
  <text x="316" y="260" class="faint" text-anchor="end">3</text>
  <text x="56" y="298" class="faint">В ОЧЕРЕДИ</text>
  <text x="64" y="320" class="acc" font-size="10">01  Трек</text>
  <text x="64" y="342" class="dim" font-size="10">02  Трек</text>
  <text x="64" y="364" class="dim" font-size="10">03  Трек</text>
  <text x="56" y="402" class="faint">ПЛЕЙЛИСТЫ · S сохранить</text>
  <text x="64" y="424" class="dim" font-size="10">▸  Плейлист 1</text>
  <line class="soft" x1="56" y1="596" x2="324" y2="596"/>
  <text x="56" y="614" class="faint">space пауза · n/p трек</text>
  <text x="56" y="628" class="faint">клик — играть · drag — переставить</text>

  <!-- MAIN -->
  <rect class="panel" x="356" y="112" width="568" height="520"/>
  <rect class="gap" x="368" y="104" width="52" height="16"/>
  <text x="372" y="116" class="lbl">MAIN</text>
  <text x="372" y="146" class="acc" font-size="10">▸ОЧЕРЕДЬ</text>
  <text x="452" y="146" class="dim" font-size="10">ПОИСК</text>
  <text x="512" y="146" class="dim" font-size="10">ЛОКАЛЬНЫЕ</text>
  <text x="596" y="146" class="dim" font-size="10">ИЗБРАННОЕ</text>
  <line class="soft" x1="372" y1="160" x2="908" y2="160"/>
  <text x="410" y="180" class="faint">№</text>
  <text x="440" y="180" class="faint">НАЗВАНИЕ</text>
  <text x="740" y="180" class="faint">ИСПОЛНИТЕЛЬ</text>
  <text x="908" y="180" class="faint" text-anchor="end">ДЛИТ</text>
  <line class="soft" x1="372" y1="188" x2="908" y2="188"/>

  <rect class="soft" x="372" y="196" width="536" height="30"/>
  <rect class="soft" x="378" y="200" width="22" height="22"/>
  <text x="412" y="216" class="faint">01</text>
  <text x="440" y="216" class="acc">Трек — играющий</text>
  <text x="908" y="216" class="faint" text-anchor="end">3:21</text>

  <rect class="soft" x="378" y="234" width="22" height="22"/>
  <text x="412" y="250" class="faint">02</text>
  <text x="440" y="250" class="dim">★ Трек из избранного</text>
  <text x="908" y="250" class="faint" text-anchor="end">4:02</text>

  <rect class="soft" x="378" y="268" width="22" height="22"/>
  <text x="412" y="284" class="faint">03</text>
  <text x="440" y="284" class="dim">Трек</text>
  <text x="908" y="284" class="faint" text-anchor="end">2:58</text>

  <text x="440" y="330" class="faint">(в покое — «очередь пуста — найди трек в ПОИСКЕ»)</text>
  <text x="440" y="360" class="faint">drag строки → перестановка очереди</text>

  <!-- SIDEBAR -->
  <rect class="panel" x="940" y="112" width="300" height="520"/>
  <rect class="gap" x="952" y="104" width="72" height="16"/>
  <text x="956" y="116" class="lbl">SIDEBAR</text>
  <text x="956" y="140" class="faint">СЕЙЧАС ИГРАЕТ</text>
  <g fill="#c9d2e2">
    <rect x="956" y="170" width="5" height="12"/>
    <rect x="965" y="162" width="5" height="20"/>
    <rect x="974" y="152" width="5" height="30"/>
    <rect x="983" y="164" width="5" height="18"/>
    <rect x="992" y="148" width="5" height="34"/>
    <rect x="1001" y="158" width="5" height="24"/>
    <rect x="1010" y="170" width="5" height="12"/>
    <rect x="1019" y="156" width="5" height="26"/>
    <rect x="1028" y="166" width="5" height="16"/>
    <rect x="1037" y="172" width="5" height="10"/>
    <rect x="1046" y="158" width="5" height="24"/>
    <rect x="1055" y="168" width="5" height="14"/>
  </g>
  <rect class="soft" x="956" y="196" width="180" height="180"/>
  <text x="1046" y="292" class="faint" text-anchor="middle" font-size="26">♪</text>
  <text x="956" y="402" class="acc" font-size="14" font-weight="bold">Трек</text>
  <text x="956" y="424" class="dim">Артист</text>
  <text x="956" y="444" class="faint">YouTube · стрим</text>
  <line class="soft" x1="956" y1="462" x2="1224" y2="462"/>
  <text x="956" y="482" class="faint">ДЕТАЛИ</text>
  <text x="956" y="504" class="faint">Источник</text><text x="1224" y="504" class="dim" text-anchor="end">YouTube</text>
  <text x="956" y="526" class="faint">В очереди</text><text x="1224" y="526" class="dim" text-anchor="end">1 / 8</text>
  <text x="956" y="548" class="faint">Длительность</text><text x="1224" y="548" class="dim" text-anchor="end">3:21</text>

  <!-- PLAYING -->
  <rect class="panel" x="40" y="648" width="1200" height="110"/>
  <rect class="gap" x="52" y="640" width="72" height="16"/>
  <text x="56" y="652" class="lbl">PLAYING</text>
  <rect class="soft" x="56" y="668" width="58" height="58"/>
  <text x="85" y="703" class="faint" text-anchor="middle" font-size="20">♪</text>
  <text x="130" y="688" class="acc" font-size="14" font-weight="bold">Трек</text>
  <text x="130" y="708" class="dim">Артист</text>
  <!-- transport: ⇄ ◁ ▶ ▷ ↻ ☆ -->
  <text x="620" y="702" class="glyph">⇄</text>
  <text x="672" y="702" class="glyph">◁</text>
  <text x="724" y="700" class="glyphAcc" font-size="20">▶</text>
  <text x="776" y="702" class="glyph">▷</text>
  <text x="828" y="702" class="glyph">↻</text>
  <text x="880" y="702" class="glyph">☆</text>
  <!-- volume -->
  <text x="1228" y="678" class="faint" text-anchor="end">VOL 100%</text>
  <rect class="soft" x="1068" y="686" width="160" height="4"/>
  <rect x="1068" y="686" width="160" height="4" fill="#c9d2e2"/>
  <!-- seek -->
  <text x="130" y="740" class="faint">0:42</text>
  <line class="soft" x1="180" y1="736" x2="1168" y2="736"/>
  <line x1="180" y1="736" x2="470" y2="736" stroke="#c9d2e2" stroke-width="2"/>
  <circle cx="470" cy="736" r="5" fill="#c9d2e2"/>
  <text x="1228" y="740" class="faint" text-anchor="end">3:21</text>

  <text x="40" y="784" class="faint">Квадрат, кромки 1px, подпись в разрыве кромки, моно, глифы транспорта — язык «text» (spotify-tui).</text>
</svg>

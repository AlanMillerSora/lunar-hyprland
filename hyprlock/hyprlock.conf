# ════════════════════════════════════════════════════════════
#  hyprlock — экран блокировки "Blood Moon"
#  {ECLIPSE_DIR} заменяется install.sh на полный путь к обоям
# ════════════════════════════════════════════════════════════

general {
    background_color = rgb(000000)
    hide_cursor = true
}

background {
    path = {ECLIPSE_DIR}/eclipse_04.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.8
    contrast = 1.0
}

clock {
    monitor =
    time_format = %H:%M
    date_format = %A, %d %B
    font_family = JetBrains Mono
    font_size = 64
    color = rgb(e6e6e6)
    position = 0, -260
    halign = center
    valign = center
}

label {
    monitor =
    text = ☾  Lunar Eclipse
    font_family = JetBrains Mono
    font_size = 20
    color = rgb(b7ccff)
    position = 0, -180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    position = 0, -110
    halign = center
    valign = center

    dots_center = true
    hide_input = false

    inner_color = rgb(000000)
    outer_color = rgb(7ea6ff)
    outline_thickness = 1
    font_color = rgb(e6e6e6)
    check_color = rgb(7ea6ff)
    fail_color = rgb(ff5a5a)

    font_family = JetBrains Mono
    radius = 14
    placeholder_text = <i>Unlock…</i>
}